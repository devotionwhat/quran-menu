<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Kids · Navigation Only</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::after, *::before { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background-color: #000;
      font-family: "Montserrat", sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ddd;
    }

    /* ========== MAIN UI (phone screen) ========== */
    .screen {
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      background-color: #F9F9F9;
      border-radius: 0;
      padding: 12px;
      overflow: hidden;
    }
    @media (min-width: 500px) {
      .screen {
        max-width: 420px; max-height: 800px;
        border-radius: 25px;
        box-shadow: 0px 0px 10px 2px rgba(140,140,140,0.15);
      }
    }

    .icon {
      object-fit: contain; height: 25px; opacity: 0.5;
      filter: grayscale(100%); cursor: pointer; transition: 0.4s ease;
    }
    .icon:hover { filter: grayscale(0%); opacity: 1; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; height: 60px; flex-shrink: 0;
    }
    .header__logo { display: flex; align-items: center; }
    .header__icon { height: 25px; object-fit: cover; margin-right: 5px; }
    .header__title { font-size: 18px; }

    .categories {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; height: 60px; flex-shrink: 0;
    }
    .categories__link {
      position: relative; font-size: 10px; padding: 6px 16px;
      border-radius: 16px; border: 1px solid #E8003C; color: #E8003C;
      cursor: pointer; overflow: hidden;
      text-decoration: none;
    }
    .categories__link::before {
      content: ""; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%; background: #E8003C; transition: 0.4s ease;
    }
    .categories__link:hover { color: #ffffff; }
    .categories__link:hover::before { left: 0%; }
    .categories__text { position: relative; z-index: 10; }

    /* ========== BOTTOM MENU – LARGER BUTTONS, NO BULLETS ========== */
    .menu {
      width: 100%;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0px 0px 5px 1px rgba(140,140,140,0.15);
      padding: 12px 16px;
      margin-top: auto;          /* push to bottom */
      flex-shrink: 0;
    }
    .menu__list {
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }
    .menu__item {
      flex: 1;
      text-align: center;
    }
    .menu__link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 6px 0;
    }
    .menu__icon {
      height: 28px;
      width: auto;
      object-fit: contain;
      margin-bottom: 4px;
      opacity: 0.5;
      filter: grayscale(100%);
      transition: 0.4s ease;
    }
    .menu__link:hover .menu__icon {
      filter: grayscale(0%);
      opacity: 1;
    }
    .menu__link:hover .menu__txt {
      color: #E8003C;
    }
    .menu__txt {
      color: #8c8c8c;
      font-size: 11px;
      font-weight: bold;
      transition: 0.4s ease;
    }

    /* Simple spacer to fill the area where videos used to be */
    .content-spacer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
